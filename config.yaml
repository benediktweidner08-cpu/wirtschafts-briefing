# Marktdaten Symbole (yfinance)
market_symbols:
  indices:
    - symbol: ^GDAXI
      name: DAX
    - symbol: ^DJI
      name: Dow Jones
    - symbol: ^GSPC
      name: S&P 500
  
  crypto:
    - symbol: BTC-USD
      name: Bitcoin
    - symbol: ETH-USD
      name: Ethereum
  
  commodities:
    - symbol: GC=F
      name: Gold
    - symbol: SI=F
      name: Silber
  
  forex:
